name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "generated/**"
      - "scripts/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "data/**"
      - "generated/**"
      - "scripts/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v5
        if: vars.DEPLOY_PAGES == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      - run: python scripts/build_site_index.py
      - run: git diff --exit-code generated/site-index.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v4
        if: vars.DEPLOY_PAGES == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: site/dist

  deploy:
    if: vars.DEPLOY_PAGES == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
