name: test

on:
  push:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHONPATH=src python -m agentlab validate
      - run: PYTHONPATH=src python -m unittest discover -s tests

  agent-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/agent-history/package-lock.json
      - run: npm ci
        working-directory: apps/agent-history
      - run: npm test
        working-directory: apps/agent-history
