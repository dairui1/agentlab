name: sync-sources

on:
  workflow_dispatch:
  schedule:
    - cron: "35 2 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python scripts/sync_sources.py
      - name: Commit source manifest changes
        run: |
          if git diff --quiet generated/source-sync-manifest.json; then
            echo "No source manifest changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/source-sync-manifest.json
          git commit -m "Refresh source sync manifest"
          git push
