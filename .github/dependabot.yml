version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      site-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/agent-history
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      agent-history-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/agent-native
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      agent-native-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
