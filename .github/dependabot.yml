version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/agent-history
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      agent-history-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
