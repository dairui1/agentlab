[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlab"
version = "0.1.0"
description = "Research workspace for agent architecture, prompts, and tooling."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Rui Dai" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
agentlab = "agentlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
