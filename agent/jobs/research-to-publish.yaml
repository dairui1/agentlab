id: research-to-publish
name: Research topic to published page
status: draft
summary: Compose topic creation, source collection, synthesis, validation, and Git publish into one agent-native workflow.
triggers:
  - user_request
  - manual_cli
stages:
  - action: create-research-topic
    required: true
  - action: collect-research-sources
    required: true
  - action: publish-research-page
    required: true
state_machine:
  initial: idea
  states:
    - idea
    - collecting
    - synthesizing
    - drafted
    - validated
    - published
    - needs-refresh
    - blocked
quality_gates:
  collecting:
    - sources.md exists.
    - Volatile facts have access dates.
  drafted:
    - research/topics/{slug}.md contains facts, inferences, and open questions.
    - site page is written in Chinese.
  validated:
    - make generated passes.
    - make validate passes.
    - make test passes.
    - site check and build pass.
  published:
    - changes are committed.
    - branch is pushed to origin.

