id: collect-research-sources
name: Collect research sources
kind: research
status: draft
owner: AgentLab
summary: Gather official, package, source, paper, and public analysis references for a topic.
entrypoints:
  agent:
    instruction: Browse when facts may be current, inspect local source caches when available, and write every usable source to sources.md.
inputs:
  slug:
    type: string
    required: true
    description: Existing research topic slug.
  research_question:
    type: string
    required: true
    description: The question the sources must answer.
outputs:
  - research/runs/{slug}/sources.md
  - research/runs/{slug}/state.md
evidence_tiers:
  official: Official docs, official repos, release notes, package registry metadata.
  primary_observation: Local source cache, package manifest, CLI output, reproducible command result.
  secondary: Blogs, papers, news reports, security reports, conference talks.
guards:
  - Record access dates for volatile web sources.
  - Separate official facts, third-party claims, and AgentLab inferences.
  - Do not download, mirror, quote, or normalize unauthorized leaked source material.
  - Do not use private account content, credentials, or internal logs.
verification:
  - sources.md contains at least three reliable sources for normal topics.
  - state.md records scope, exclusions, and open questions.

