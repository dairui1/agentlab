id: sync-agent-sources
name: Sync agent sources
kind: source-sync
status: active
owner: AgentLab
summary: Refresh public source/package caches and update the generated source manifest.
entrypoints:
  cli:
    command: make sync-sources
  scheduled:
    workflow: .github/workflows/sync-sources.yml
  local_job:
    command: make source-sync-job
inputs:
  target_config:
    type: path
    required: true
    default: data/source_targets.json
outputs:
  - research/sources/cache/
  - generated/source-sync-manifest.json
guards:
  - Cache directories stay out of Git.
  - Respect each target's include and exclude rules.
  - Exclude source maps or leaked artifacts unless a future policy explicitly allows a safe metadata-only mode.
  - Commit only generated manifests and reviewable metadata.
verification:
  - make sync-sources
  - git diff -- generated/source-sync-manifest.json

