<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="AgentLab Sub-agent control contract explorer：查询创建、寻址、等待、恢复、结果、取消和文件副作用。">
  <title>Sub-agent control contracts · AgentLab</title>
  <link rel="icon" type="image/png" href="/assets/agentlab-mark.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/mechanisms.css">
</head>
<body>
  <div class="app-shell contract-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="AgentLab 首页">
        <span class="brand-mark" aria-hidden="true"><img src="/assets/agentlab-mark.png" alt=""></span>
        <span class="brand-copy"><strong>AgentLab</strong><span>机制档案</span></span>
      </a>
      <div class="segmented mode-switch" role="group" aria-label="页面视图">
        <a href="/"><i data-lucide="newspaper" aria-hidden="true"></i><span>更新情报</span></a>
        <a href="/?mode=compare"><i data-lucide="file-diff" aria-hidden="true"></i><span>版本比较</span></a>
        <a href="/mechanisms" aria-current="page"><i data-lucide="network" aria-hidden="true"></i><span>机制档案</span></a>
      </div>
      <div class="header-links">
        <a class="icon-button" href="https://github.com/dairui1/agentlab" target="_blank" rel="noopener noreferrer" aria-label="打开 AgentLab GitHub 仓库" title="GitHub 仓库"><i data-lucide="github" aria-hidden="true"></i></a>
      </div>
    </header>

    <main id="contractApp" class="contract-app" aria-busy="true">
      <div id="contractStatus" class="contract-status" role="status" aria-live="polite">
        <span class="loading-spinner" aria-hidden="true"></span><span>正在装载控制合同</span>
      </div>

      <header id="contractHeader" class="contract-header" hidden>
        <div class="contract-title-block">
          <div class="contract-context-row">
            <span id="contractEyebrow" class="contract-eyebrow">MECHANISM / SUB-AGENT ORCHESTRATION</span>
            <label class="mechanism-picker" for="mechanismPicker">
              <span>机制</span>
              <select id="mechanismPicker" aria-label="选择机制档案">
                <option value="subagent-orchestration">Sub-agent 编排</option>
                <option value="context-compaction">上下文压缩</option>
              </select>
            </label>
          </div>
          <div class="contract-title-row">
            <h1 id="contractTitle"></h1>
            <span id="contractDate" class="contract-date"></span>
          </div>
          <p id="contractSubtitle"></p>
        </div>
        <div id="snapshotLine" class="contract-snapshots" aria-label="核验版本"></div>
      </header>

      <section id="sharpEdgeStrip" class="sharp-edge-strip" aria-label="关键合同差异" hidden></section>

      <nav id="viewTabs" class="contract-view-tabs" role="tablist" aria-label="机制视图" hidden>
        <button id="tabCompare" type="button" role="tab" aria-controls="contractPanel" data-view="compare"><i data-lucide="table-properties" aria-hidden="true"></i><span>操作速查</span></button>
        <button id="tabFlows" type="button" role="tab" aria-controls="contractPanel" data-view="flows"><i data-lucide="workflow" aria-hidden="true"></i><span>生命周期</span></button>
        <button id="tabFailures" type="button" role="tab" aria-controls="contractPanel" data-view="failures"><i data-lucide="triangle-alert" aria-hidden="true"></i><span>失败面</span></button>
        <button id="tabResources" type="button" role="tab" aria-controls="contractPanel" data-view="resources"><i data-lucide="layers-3" aria-hidden="true"></i><span>隔离与资源</span></button>
        <button id="tabChanges" type="button" role="tab" aria-controls="contractPanel" data-view="changes"><i data-lucide="git-compare-arrows" aria-hidden="true"></i><span>版本变化</span></button>
      </nav>

      <div id="contractWorkspace" class="contract-workspace" hidden>
        <aside class="operation-rail" aria-labelledby="operationRailTitle">
          <div class="rail-heading">
            <span id="operationRailTitle">开发者要做什么</span>
          </div>
          <nav id="operationList" aria-label="按操作筛选">
            <button id="showAllOperations" class="operation-button rail-all" type="button" aria-pressed="true"><i data-lucide="rows-3" aria-hidden="true"></i><span>全部操作</span></button>
          </nav>
          <div class="rail-scope">
            <strong>Evidence scope</strong>
            <span>model-visible contract</span>
            <span>exact-tag source</span>
            <span>official docs / release</span>
          </div>
        </aside>

        <section id="contractPanel" class="contract-canvas" role="tabpanel" aria-live="polite" aria-labelledby="tabCompare">
          <header class="canvas-heading">
            <div>
              <span id="canvasKicker"></span>
              <h2 id="canvasTitle"></h2>
              <p id="canvasDescription"></p>
            </div>
            <div class="contract-state-legend" aria-label="合同状态">
              <span data-state="exposed">已暴露</span>
              <span data-state="partial">有边界</span>
              <span data-state="not-exposed">未暴露</span>
              <span data-state="unknown">未知</span>
            </div>
          </header>
          <div id="canvasContent" class="canvas-content"></div>
        </section>

        <aside id="evidenceInspector" class="evidence-inspector" aria-labelledby="inspectorTitle">
          <header>
            <div><span id="inspectorContext">EVIDENCE INSPECTOR</span><h2 id="inspectorTitle">选择一条合同</h2></div>
            <button id="closeInspector" class="icon-button" type="button" aria-label="关闭证据详情" title="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
          </header>
          <div id="inspectorContent" class="inspector-content">
            <p class="inspector-empty">点击任意“证据”按钮，在不离开当前比较位置的情况下检查版本、来源和边界。</p>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="/mechanisms.js"></script>
</body>
</html>
