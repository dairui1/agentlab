      <div id="promptDiffStatus" class="prompt-diff-status" role="status">正在载入 Prompt…</div>

        <summary>来源与核验</summary>

        <p>5.5 与官方字节一致；5.6 仅有排版差异。Astra 的异步提问段仍有差异：收集版等待示例 30 秒，官方对照为 60 秒，并调整工具入口与附件限制。
          <button class="evidence-ref" type="button" data-evidence="GP-21 GP-22" data-evidence-trigger>GP-21 / GP-22</button>
        </p>
